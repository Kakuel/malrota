name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # GitHub 저장소 Variables의 REACT_APP_API_BASE_URL에 Railway 공개 URL을 넣습니다.
      REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check backend URL
        run: |
          test -n "$REACT_APP_API_BASE_URL" || {
            echo "REACT_APP_API_BASE_URL GitHub repository variable is required."
            exit 1
          }
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Disable Jekyll
        run: touch build/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
