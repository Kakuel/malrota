spring.application.name=backend
# Railway는 실행 포트를 PORT 환경 변수로 전달합니다. 로컬에서는 8081을 유지합니다.
server.port=${PORT:8081}

# GitHub Pages 배포 주소는 Railway의 CORS_ALLOWED_ORIGINS 환경 변수로 허용합니다.
# 예: https://kakuel.github.io (경로 /malrota는 포함하지 않음)
malrota.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ==========================================
# 1. IBM watsonx.ai 설정
# ==========================================
watsonx.enabled=${WATSONX_ENABLED:true}
watsonx.api-key=${WATSONX_API_KEY:}
watsonx.project-id=${WATSONX_PROJECT_ID:}
watsonx.url=${WATSONX_URL:https://us-south.ml.cloud.ibm.com}
watsonx.model-id=${WATSONX_MODEL_ID:mistralai/mistral-small-3-1-24b-instruct-2503}

# ==========================================
# 2. IBM Speech to Text (STT) 설정
# ==========================================
ibm.stt.enabled=${IBM_STT_ENABLED:true}
ibm.stt.url=${IBM_STT_URL:}
ibm.stt.api-key=${IBM_STT_API_KEY:}
ibm.stt.model=${IBM_STT_MODEL:ko-KR_Multimedia}

# ==========================================
# 3. IBM Text to Speech (TTS) 설정
# ==========================================
ibm.tts.enabled=${IBM_TTS_ENABLED:true}
ibm.tts.url=${IBM_TTS_URL:}
ibm.tts.api-key=${IBM_TTS_API_KEY:}
ibm.tts.voice=${IBM_TTS_VOICE:ko-KR_HyunjunV3Voice}

# ==========================================
# 4. 국토교통부 TAGO 고속버스 API 설정
# ==========================================
tago.enabled=${TAGO_ENABLED:true}
tago.service-key=${TAGO_SERVICE_KEY:}
tago.base-url=http://apis.data.go.kr/1613000/ExpBusInfo

# ==========================================
# 5. PostgreSQL 예매 내역 저장소
# ==========================================
# 실제 값은 backend/.env에 두고, .env 파일은 Git에 올리지 않습니다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/malrota}
spring.datasource.username=${DB_USERNAME:malrota}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
# JPA가 bookings 테이블을 만든 뒤, 사람이 보기 좋은 조회용 뷰를 생성한다.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
